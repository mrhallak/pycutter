[project]
name = "pycutter"
version = "0.1.0"
description = "My cookiecutter template"
readme = "README.md"
authors = [{ name = "Mohamad Hallak", email="16711801+mrhallak@users.noreply.github.com"}]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-codecov>=0.7.0",
    "ruff>=0.14.3",
    "ty>=0.0.1a25",
]

[tool.ruff]
# Set the maximum line length to 88 (Black's default)
line-length = 88
indent-width = 4

# Target Python 3.13
target-version = "py313"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    ".eggs",
    ".tox",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable commonly used rule sets
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented-out code)
    "PL",    # pylint
    "PERF",  # perflint
    "RUF",   # ruff-specific rules
]

# Allow autofix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# Configure import sorting
known-first-party = ["pycutter"]
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
# Set maximum complexity (default is 10)
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings (alternatives: "numpy", "pep257")
convention = "google"

[tool.ruff.lint.pylint]
# Set maximum number of arguments
max-args = 5

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Use spaces for indentation
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect line endings
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings
docstring-code-format = true
